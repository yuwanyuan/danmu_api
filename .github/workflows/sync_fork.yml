name: Fork Sync

permissions:
    contents: write

on:
    schedule:
        - cron: "0 0 * * *"  # 每天午夜执行
    workflow_dispatch:  # 允许手动触发

concurrency:
    group: fork-sync
    cancel-in-progress: false

jobs:
    sync_with_upstream:
        name: Sync with Upstream
        runs-on: ubuntu-latest
        if: ${{ github.event.repository.fork }}

        steps:
            - name: Checkout target repo
              uses: actions/checkout@v5
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  fetch-depth: 0

            - name: Sync Upstream
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  UPSTREAM_URL="https://github.com/huangxd-/danmu_api.git"
                  if git remote get-url upstream >/dev/null 2>&1; then
                      git remote set-url upstream "$UPSTREAM_URL"
                  else
                      git remote add upstream "$UPSTREAM_URL"
                  fi
                  git fetch upstream main

                  if git merge-base --is-ancestor upstream/main HEAD; then
                      echo "Already up to date with upstream."
                      exit 0
                  fi

                  # 记录合并前的 HEAD，后面用它把 .github 整体还原
                  PRE_MERGE_HEAD="$(git rev-parse HEAD)"

                  # .gitattributes 里的 merge=ours 只在"双方都改同一文件"时生效；
                  # 上游新增/删除 .github 下的文件属于 modify/delete 冲突，合并驱动不接管，
                  # 所以这里统一按"保留本仓库版本（含删除）"处理。
                  git config merge.ours.driver true

                  merge_failed=0
                  git merge --no-ff --no-commit upstream/main || merge_failed=1

                  if [ "$merge_failed" -eq 1 ]; then
                      others="$(git diff --name-only --diff-filter=U | grep -v '^\.github/' || true)"
                      if [ -n "$others" ]; then
                          echo "::error::上游代码存在无法自动合并的冲突，需要人工解决："
                          echo "$others"
                          exit 1
                      fi
                  fi

                  # GITHUB_TOKEN 没有 workflow 权限，无法推送 .github/workflows 的变更，
                  # 因此把 .github 目录整体恢复为合并前的内容（删除上游新增文件、恢复被上游删掉的文件）
                  git rm -rfq --ignore-unmatch -- .github
                  git checkout "$PRE_MERGE_HEAD" -- .github
                  git add -A -- .github

                  if [ -f .git/MERGE_HEAD ]; then
                      git commit --no-edit
                  elif ! git diff --cached --quiet; then
                      git commit -m "chore: 同步上游代码（保留本仓库 .github）"
                  fi

                  # 兜底：确保没有把 .github/workflows 的变更带进提交
                  if ! git diff --quiet "$PRE_MERGE_HEAD" HEAD -- .github/; then
                      echo "::error::.github 目录被意外修改，请检查合并逻辑"
                      git diff --name-only "$PRE_MERGE_HEAD" HEAD -- .github/
                      exit 1
                  fi

                  git push origin main