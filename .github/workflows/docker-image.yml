name: Build and Push Docker Image to Docker Hub

on:
  push:
    branches:
      - main

jobs:
  # 检查 Docker Hub secrets 是否已配置：fork 未配置时跳过构建，避免每次推送都失败
  check-secrets:
    name: Check Docker Hub secrets
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check secrets
        id: check
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKER_USERNAME / DOCKER_PASSWORD secrets 未配置，跳过 Docker 镜像构建与推送"
          fi

  build:
    name: Build and Push Docker Image
    needs: check-secrets
    if: needs.check-secrets.outputs.enabled == 'true'
    runs-on: ubuntu-latest

    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 从 danmu_api/configs/globals.js 中读取版本号
      - name: Read version from globals.js
        id: version
        run: |
          VERSION=$(grep "VERSION:" danmu_api/configs/globals.js | sed -E "s/.*VERSION: '(.*)'.*/\1/")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      # 根据分支设置版本号后缀
      - name: Set version suffix
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "VERSION_TAG=${{ env.VERSION }}-test" >> $GITHUB_ENV
          else
            echo "VERSION_TAG=${{ env.VERSION }}" >> $GITHUB_ENV
          fi

      # ✅ 先登录，再初始化 Buildx，避免拉取 BuildKit 镜像时触发匿名限速
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 登录后手动拉取，绕过匿名限速
      - name: Pull BuildKit image
        run: docker pull moby/buildkit:buildx-stable-1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker buildx build --platform linux/amd64,linux/arm64 \
              -t ${{ secrets.DOCKER_USERNAME }}/danmu-api:${{ env.VERSION_TAG }} \
              -t ${{ secrets.DOCKER_USERNAME }}/danmu-api:latest \
              --push .
          else
            docker buildx build --platform linux/amd64,linux/arm64 \
              -t ${{ secrets.DOCKER_USERNAME }}/danmu-api:${{ env.VERSION_TAG }} \
              --push .
          fi
